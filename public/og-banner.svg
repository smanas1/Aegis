<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050813" />
      <stop offset="50%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <radialGradient id="radial1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.25)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>
    <radialGradient id="radial2" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.2)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#radial1)" />
  <rect width="1200" height="630" fill="url(#radial2)" />

  <!-- Grid lines -->
  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
  </g>

  <!-- Shield Icon -->
  <g transform="translate(100, 140)">
    <rect x="-10" y="-10" width="100" height="100" rx="24" fill="url(#glow)" opacity="0.9" />
    <path d="M40 18 L68 30 L68 56 C68 76 56 94 40 102 C24 94 12 76 12 56 L12 30 Z" fill="#04060c" />
    <path d="M34 54 L38 58 L48 46" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Title & Branding -->
  <text x="220" y="195" font-family="system-ui, sans-serif" font-weight="800" font-size="44" fill="#ffffff" letter-spacing="-1">
    AEGIS AI STUDIO
  </text>
  <rect x="620" y="162" width="220" height="34" rx="17" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.5" />
  <text x="730" y="184" font-family="monospace" font-weight="700" font-size="14" fill="#10b981" text-anchor="middle">
    C2PA • SynthID • Unicode
  </text>

  <!-- Headline -->
  <text x="100" y="300" font-family="system-ui, sans-serif" font-weight="800" font-size="52" fill="#ffffff" letter-spacing="-1.5">
    Eradicate AI Metadata &amp; Watermarks
  </text>

  <text x="100" y="360" font-family="system-ui, sans-serif" font-weight="500" font-size="26" fill="#94a3b8">
    Bypass LinkedIn &amp; Meta "Created with AI" badges. 100% Client-Side Private.
  </text>

  <!-- Pills / Feature Badges -->
  <g transform="translate(100, 440)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="270" height="52" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.12)" />
    <circle cx="26" cy="26" r="8" fill="#10b981" />
    <text x="46" y="32" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#f1f5f9">C2PA Manifest Stripper</text>

    <!-- Badge 2 -->
    <rect x="290" y="0" width="290" height="52" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.12)" />
    <circle cx="316" cy="26" r="8" fill="#06b6d4" />
    <text x="336" y="32" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#f1f5f9">SynthID Steganography Wash</text>

    <!-- Badge 3 -->
    <rect x="600" y="0" width="270" height="52" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.12)" />
    <circle cx="626" cy="26" r="8" fill="#a855f7" />
    <text x="646" y="32" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#f1f5f9">AI Text Humanizer</text>
  </g>

  <!-- Domain Tag bottom -->
  <text x="100" y="565" font-family="monospace" font-weight="700" font-size="20" fill="#38bdf8">
    https://aegis.smanas.net
  </text>
</svg>
